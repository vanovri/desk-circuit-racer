name: Route and driving contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: python -m unittest discover -s tests -v
      - run: python verify_desk_racer.py --report reports/ci-route.json
      - run: npm test
      - run: node tools/replay.mjs
      - run: node tools/build.mjs
      - run: git diff --exit-code -- desk_racer.html
      - uses: actions/upload-artifact@v4
        with:
          name: geometry-and-replay-${{ matrix.os }}
          path: |
            reports/ci-route.json
            reports/guided-replay.json
